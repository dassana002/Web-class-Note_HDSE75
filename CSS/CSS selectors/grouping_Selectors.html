<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grouping Selectors</title>

    <style>

        p, h1, #abc, .ABC, [href] {
            color: deepskyblue;
        }

    </style>
</head>
<body>

    <h1> Hello Dassana!</h1>

    <h2 id="abc"> How are you!</h2>

    <p>
        I am dassana. twenty-three years old and live in galle, but just always live in panadura.
    </p>

    <a href="https://www.google.com">Google</a>

</body>
</html>
