<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example 1</title>
    <style>

        #section1 > div:first-child > ol > li:first-child {
            color: red;
        }

    </style>
</head>
<body>
    <section id="section1">
        <div>
            <ol>
                <li>Sri Lanka</li>
                <li>India</li>
            </ol>
            <div>
                <ol>
                    <li>Russia</li>
                </ol>
            </div>
        </div>
        <div>
            <div>
                <ol>
                    <li>UK</li>
                    <li>USA</li>
                </ol>
            </div>
        </div>
    </section>

    <section id="section2">
        <div>
            <ol>
                <li>UAE</li>
                <li>Dubai</li>
            </ol>
        </div>
        <div>
            <div>
                <ol>
                    <li>Japan</li>
                    <li>China</li>
                </ol>
            </div>
        </div>
    </section>
</body>
</html>
